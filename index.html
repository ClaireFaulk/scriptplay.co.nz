<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multiplayer Interactive Script Game</title>
<style>
:root{--bg:#fbfaf7;--fg:#1d2230;--mut:#5b6275;--line:#d9d6cc;--acc:#2f5d8a;--code:#eee9dd;--th:#efece3}
@media (prefers-color-scheme:dark){:root{--bg:#14171f;--fg:#e6e8ee;--mut:#9aa1b3;--line:#2b303d;--acc:#8ab4e6;--code:#222733;--th:#1c212c}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.65 Georgia,"Times New Roman",serif}
.wrap{max-width:860px;margin:0 auto;padding:2rem 1.25rem 4rem}
h1,h2,h3,nav,table,.meta{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:2rem;line-height:1.2;margin:.2rem 0}
h2{font-size:1.45rem;margin:2.6rem 0 .6rem;padding-top:1rem;border-top:1px solid var(--line)}
h3{font-size:1.1rem;margin:1.6rem 0 .4rem}
.meta{color:var(--mut);font-size:.95rem}
a{color:var(--acc)}
nav{background:var(--th);border:1px solid var(--line);border-radius:6px;padding:.8rem 1rem;margin:1.5rem 0;font-size:.95rem}
nav ul{list-style:none;margin:0;padding:0;columns:2;column-gap:2rem}
nav li{margin:.15rem 0}
code{background:var(--code);padding:.05em .35em;border-radius:3px;font-size:.88em}
ul,ol{padding-left:1.4rem}
li{margin:.25rem 0}
.scroll{overflow-x:auto;margin:1rem 0}
table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:520px}
th,td{border:1px solid var(--line);padding:.5rem .65rem;text-align:left;vertical-align:top}
th{background:var(--th)}
.note{border-left:3px solid var(--acc);padding:.2rem 1rem;color:var(--mut);margin:1rem 0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:600px){nav ul{columns:1}body{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Multiplayer Interactive Script</h1>
